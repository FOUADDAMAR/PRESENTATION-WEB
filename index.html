<!-- أضف هذه الخيارات بشريط الأدوات -->
<button onclick="toggleDrawing()">✏️ رسم حر</button>
<button onclick="undoStep()">↩️ تراجع</button>
<button onclick="searchAndReplace()">🔍 بحث واستبدال</button>

<script>
    /* 13. لوحة الرسم الحر */
    let drawing = false;
    function toggleDrawing() {
        let card = document.getElementById('slideCard');
        card.onmousedown = () => drawing = true;
        card.onmouseup = () => drawing = false;
        card.onmousemove = (e) => {
            if(!drawing) return;
            let dot = document.createElement('div');
            dot.style.cssText = `position:absolute; width:4px; height:4px; background:red; border-radius:50%; left:${e.layerX}px; top:${e.layerY}px;`;
            card.appendChild(dot);
        }
    }

    /* 16. البحث والاستبدال */
    function searchAndReplace() {
        let word = prompt("الكلمة المراد البحث عنها:");
        let newWord = prompt("الكلمة الجديدة:");
        if (word && newWord) {
            slides.forEach(s => {
                s.title = s.title.replaceAll(word, newWord);
                s.body = s.body.replaceAll(word, newWord);
            });
            loadCurrentSlide();
            saveToStorage();
        }
    }
</script>
