<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générateur de Présentations Web</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { display: flex; height: 100vh; background-color: #f4f6f9; color: #333; transition: background-color 0.3s, color 0.3s; }
        
        /* Styles de la barre latérale et des outils */
        .sidebar { width: 300px; background: #fff; border-right: 1px solid #ddd; display: flex; flex-direction: column; padding: 15px; transition: background 0.3s, border-color 0.3s; }
        .sidebar h2 { font-size: 1.2rem; margin-bottom: 15px; color: #2c3e50; }
        .slide-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
        .slide-thumb { padding: 10px; border: 2px solid #e0e0e0; border-radius: 6px; cursor: pointer; background: #fafafa; position: relative; transition: all 0.2s; }
        .slide-thumb.active { border-color: #3498db; background: #ebf5fb; }
        .slide-thumb .controls { position: absolute; right: 5px; top: 5px; display: flex; gap: 4px; }
        .slide-thumb button { background: none; border: none; cursor: pointer; font-size: 0.8rem; opacity: 0.6; }
        .slide-thumb button:hover { opacity: 1; }
        
        .main-content { flex: 1; display: flex; flex-direction: column; }
        .toolbar { background: #fff; border-bottom: 1px solid #ddd; padding: 10px 20px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; transition: background 0.3s, border-color 0.3s; }
        .toolbar select, .toolbar button { padding: 8px 12px; border: 1px solid #ccc; border-radius: 4px; background: #fff; cursor: pointer; font-size: 0.9rem; }
        .toolbar button.primary { background: #3498db; color: white; border: none; }
        .toolbar button.primary:hover { background: #2980b9; }
        .toolbar button.success { background: #2ecc71; color: white; border: none; }
        .toolbar button.success:hover { background: #27ae60; }
        
        .editor-area { flex: 1; padding: 30px; display: flex; justify-content: center; align-items: center; overflow-y: auto; }
        .slide-card { width: 100%; max-width: 800px; aspect-ratio: 16/9; background: white; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border-radius: 8px; padding: 40px; display: flex; flex-direction: column; justify-content: center; gap: 20px; position: relative; transition: background 0.3s, color 0.3s; }
        .slide-card input, .slide-card textarea { width: 100%; border: 1px dashed transparent; padding: 8px; background: transparent; font-size: 1rem; color: inherit; transition: border 0.2s; }
        .slide-card input:hover, .slide-card textarea:hover, .slide-card input:focus, .slide-card textarea:focus { border-color: #cbd5e1; outline: none; background: rgba(0,0,0,0.02); }
        .slide-card input.title-input { font-size: 2rem; font-weight: bold; }
        .slide-card textarea.body-input { font-size: 1.2rem; resize: none; height: 120px; }
        .slide-card img.preview-img { max-height: 180px; object-fit: contain; border-radius: 4px; }
        
        /* Modal Galerie */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 20px; border-radius: 8px; max-width: 600px; width: 90%; }
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 15px; }
        .gallery-grid img { width: 100%; height: 100px; object-fit: cover; border-radius: 4px; cursor: pointer; border: 2px solid transparent; }
        .gallery-grid img:hover { border-color: #3498db; }

        /* --- THÈME SOMBRE --- */
        body.dark-mode { background-color: #1e1e2e; color: #f8f9fa; }
        body.dark-mode .sidebar { background-color: #2b2b3d; border-color: #444; color: #fff; }
        body.dark-mode .sidebar h2 { color: #fff; }
        body.dark-mode .slide-thumb { background: #3b3b4f; border-color: #555; color: #fff; }
        body.dark-mode .slide-thumb.active { border-color: #3498db; background: #253342; }
        body.dark-mode .toolbar { background-color: #2b2b3d; border-color: #444; color: #fff; }
        body.dark-mode .toolbar select, body.dark-mode .toolbar button { background-color: #3b3b4f; color: #fff; border-color: #555; }
        body.dark-mode .slide-card { background-color: #2b2b3d; color: #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }

        /* --- IMPRESSION ET EXPORTATION PDF --- */
        @media print {
            .sidebar, .toolbar, .modal { display: none !important; }
            body { background: white !important; color: black !important; }
            .editor-area { padding: 0 !important; }
            .slide-card { box-shadow: none !important; width: 100% !important; height: 100vh !important; border-radius: 0 !important; page-break-after: always; }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>Mes Diapos</h2>
        <div class="slide-list" id="slideList"></div>
        <button class="primary" onclick="addSlide()">+ Nouvelle Diapo</button>
    </div>

    <div class="main-content">
        <div class="toolbar">
            <label>Modèle :</label>
            <select id="templateSelect" onchange="loadTemplate(this.value)">
                <option value="">-- Choisir un modèle --</option>
                <option value="projet">🚀 Présentation de Projet</option>
                <option value="expose">📚 Exposé Scolaire</option>
            </select>

            <button onclick="openGallery()">🖼️ Galerie d'images</button>
            <button onclick="document.getElementById('imgUpload').click()">📤 Importer Image</button>
            <input type="file" id="imgUpload" accept="image/*" style="display:none" onchange="handleImageUpload(event)">
            
            <!-- Nouveaux boutons : Couleur/Thème et Imprimer -->
            <button onclick="toggleTheme()">🎨 Mode Sombre / Clair</button>
            <button class="success" onclick="window.print()">🖨️ Imprimer / PDF</button>
            
            <button class="primary" onclick="toggleFullscreen()">▶️ Mode Présentation</button>
        </div>

        <div class="editor-area">
            <div class="slide-card" id="slideCard">
                <input type="text" class="title-input" id="slideTitle" placeholder="Titre de la diapositive..." oninput="updateCurrentSlide()">
                <textarea class="body-input" id="slideBody" placeholder="Contenu texte..." oninput="updateCurrentSlide()"></textarea>
                <img id="slideImg" class="preview-img" style="display:none;" />
            </div>
        </div>
    </div>

    <!-- Modal Galerie d'images -->
    <div class="modal" id="galleryModal">
        <div class="modal-content">
            <h3>Choisir une image exemple</h3>
            <div class="gallery-grid" id="galleryGrid"></div>
            <button style="margin-top:15px;" onclick="closeGallery()">Fermer</button>
        </div>
    </div>

    <script>
        const stockImages = [
            "https://images.unsplash.com/photo-1557804506-669a67965ba0?w=500",
            "https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=500",
            "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=500"
        ];

        let slides = JSON.parse(localStorage.getItem('presentation_slides')) || [
            { title: "Bienvenue sur votre présentation", body: "Modifiez ce texte ou choisissez un modèle ci-dessus.", image: "" }
        ];
        let currentIndex = 0;

        function saveToStorage() {
            localStorage.setItem('presentation_slides', JSON.stringify(slides));
        }

        function renderSlideList() {
            const list = document.getElementById('slideList');
            list.innerHTML = '';
            slides.forEach((slide, index) => {
                const thumb = document.createElement('div');
                thumb.className = `slide-thumb ${index === currentIndex ? 'active' : ''}`;
                thumb.onclick = () => selectSlide(index);
                thumb.innerHTML = `
                    <strong>Diapo ${index + 1}</strong>: ${slide.title.substring(0, 15) || 'Sans titre'}
                    <div class="controls">
                        <button onclick="event.stopPropagation(); deleteSlide(${index})">🗑️</button>
                    </div>
                `;
                list.appendChild(thumb);
            });
        }

        function selectSlide(index) {
            currentIndex = index;
            loadCurrentSlide();
            renderSlideList();
        }

        function loadCurrentSlide() {
            const current = slides[currentIndex];
            document.getElementById('slideTitle').value = current.title || '';
            document.getElementById('slideBody').value = current.body || '';
            const imgEl = document.getElementById('slideImg');
            if (current.image) {
                imgEl.src = current.image;
                imgEl.style.display = 'block';
            } else {
                imgEl.style.display = 'none';
            }
        }

        function updateCurrentSlide() {
            slides[currentIndex].title = document.getElementById('slideTitle').value;
            slides[currentIndex].body = document.getElementById('slideBody').value;
            saveToStorage();
            renderSlideList();
        }

        function addSlide() {
            slides.push({ title: "Nouvelle Diapositive", body: "", image: "" });
            currentIndex = slides.length - 1;
            loadCurrentSlide();
            renderSlideList();
            saveToStorage();
        }

        function deleteSlide(index) {
            if (slides.length <= 1) return;
            slides.splice(index, 1);
            if (currentIndex >= slides.length) currentIndex = slides.length - 1;
            loadCurrentSlide();
            renderSlideList();
            saveToStorage();
        }

        function handleImageUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                slides[currentIndex].image = event.target.result;
                loadCurrentSlide();
                saveToStorage();
            };
            reader.readAsDataURL(file);
        }

        function openGallery() {
            const grid = document.getElementById('galleryGrid');
            grid.innerHTML = '';
            stockImages.forEach(url => {
                const img = document.createElement('img');
                img.src = url;
                img.onclick = () => {
                    slides[currentIndex].image = url;
                    loadCurrentSlide();
                    saveToStorage();
                    closeGallery();
                };
                grid.appendChild(img);
            });
            document.getElementById('galleryModal').style.display = 'flex';
        }

        function closeGallery() {
            document.getElementById('galleryModal').style.display = 'none';
        }

        function loadTemplate(type) {
            if (type === 'projet') {
                slides = [
                    { title: "🚀 Nom du Projet", body: "Une brève présentation du projet et de ses enjeux.", image: stockImages[0] },
                    { title: "🎯 Le Problème", body: "Quel problème cherchons-nous à résoudre ?", image: "" },
                    { title: "💡 La Solution", body: "Notre approche innovante et ses avantages.", image: stockImages[1] }
                ];
            } else if (type === 'expose') {
                slides = [
                    { title: "📚 Titre de l'Exposé", body: "Présenté par : [Votre Nom]", image: stockImages[2] },
                    { title: "1. Introduction", body: "Mise en contexte du sujet.", image: "" },
                    { title: "2. Conclusion", body: "Synthèse et remerciements.", image: "" }
                ];
            }
            currentIndex = 0;
            loadCurrentSlide();
            renderSlideList();
            saveToStorage();
        }

        function toggleFullscreen() {
            const elem = document.getElementById('slideCard');
            if (elem.requestFullscreen) {
                elem.requestFullscreen();
            }
        }

        // Basculer entre le mode clair et le mode sombre
        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
        }

        // Initialisation
        renderSlideList();
        loadCurrentSlide();
    </script>
</body>
</html>
