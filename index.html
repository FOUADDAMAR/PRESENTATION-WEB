<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Presentation Pro & Research Suite</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --bg-main: #f1f5f9;
            --panel-bg: #ffffff;
            --border-color: #cbd5e1;
            --text-color: #0f172a;
            --accent: #7c3aed;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', 'Poppins', sans-serif; }
        body { display: flex; flex-direction: column; height: 100vh; background: var(--bg-main); color: var(--text-color); overflow: hidden; }

        /* Office Ribbon Bar - شريط التبويبات العلوي */
        .ribbon-header { background: #1e293b; color: white; display: flex; align-items: center; justify-content: space-between; padding: 5px 20px; font-size: 0.9rem; }
        .ribbon-tabs { display: flex; background: #0f172a; padding: 0 15px; border-bottom: 1px solid var(--border-color); }
        .tab-btn { background: none; border: none; color: #94a3b8; padding: 10px 18px; cursor: pointer; font-weight: 700; font-size: 0.9rem; border-bottom: 3px solid transparent; }
        .tab-btn.active { color: white; border-bottom-color: var(--primary); background: rgba(255,255,255,0.05); }

        .ribbon-toolbar { background: var(--panel-bg); border-bottom: 1px solid var(--border-color); padding: 8px 15px; display: none; gap: 15px; align-items: center; flex-wrap: wrap; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .ribbon-toolbar.active { display: flex; }

        .tool-group { display: flex; align-items: center; gap: 6px; border-left: 1px solid #e2e8f0; padding-left: 10px; }
        .tool-group:last-child { border-left: none; }
        .tool-group label { font-size: 0.75rem; font-weight: 700; color: #64748b; margin-bottom: 2px; display: block; }

        .btn-tool { padding: 6px 12px; border: 1px solid var(--border-color); border-radius: 6px; background: white; cursor: pointer; font-size: 0.82rem; font-weight: 600; display: flex; align-items: center; gap: 5px; transition: all 0.2s; }
        .btn-tool:hover { background: #f8fafc; border-color: var(--primary); }
        .btn-tool.primary { background: var(--primary); color: white; border: none; }
        .btn-tool.ai-btn { background: linear-gradient(135deg, #8b5cf6, #ec4899); color: white; border: none; }

        /* App Layout */
        .app-body { display: flex; flex: 1; height: calc(100vh - 120px); }

        /* Left/Right Sidebar */
        .sidebar { width: 300px; background: var(--panel-bg); border-left: 1px solid var(--border-color); display: flex; flex-direction: column; padding: 15px; gap: 12px; }
        .sidebar h3 { font-size: 0.95rem; font-weight: 800; color: var(--primary); }
        
        .slide-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .slide-thumb { padding: 10px; border: 2px solid #e2e8f0; border-radius: 8px; cursor: pointer; background: #f8fafc; position: relative; font-size: 0.85rem; }
        .slide-thumb.active { border-color: var(--primary); background: #eff6ff; font-weight: 700; }

        /* Editor Work Area */
        .workspace { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; overflow-y: auto; position: relative; }
        .slide-wrapper { position: relative; width: 100%; max-width: 900px; aspect-ratio: 16/9; }
        
        .slide-card { width: 100%; height: 100%; background: white; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); border: 1px solid var(--border-color); padding: 40px; display: flex; flex-direction: column; justify-content: center; gap: 15px; position: relative; text-align: right; overflow: hidden; }

        /* Background Presets */
        .bg-gradient-blue { background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%) !important; color: white !important; }
        .bg-gradient-purple { background: linear-gradient(135deg, #581c87 0%, #a855f7 100%) !important; color: white !important; }
        .bg-gradient-dark { background: linear-gradient(135deg, #0f172a 0%, #334155 100%) !important; color: white !important; }

        .slide-card input, .slide-card textarea { width: 100%; border: 1px dashed transparent; padding: 6px; background: transparent; color: inherit; font-family: inherit; }
        .slide-card input:focus, .slide-card textarea:focus { border-color: var(--primary); outline: none; background: rgba(37, 99, 235, 0.05); }
        .slide-card input.title-input { font-size: 2.2rem; font-weight: 900; }
        .slide-card textarea.body-input { font-size: 1.1rem; resize: none; height: 140px; line-height: 1.6; }
        .slide-card img.preview-img { max-height: 200px; object-fit: contain; margin: 0 auto; border-radius: 8px; }

        /* Shapes & Canvas */
        .shapes-layer { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
        .shape-item { position: absolute; pointer-events: auto; cursor: move; user-select: none; display: flex; align-items: center; justify-content: center; }
        
        #drawCanvas { position: absolute; inset: 0; z-index: 10; pointer-events: none; border-radius: 12px; }
        #drawCanvas.active { pointer-events: auto; cursor: crosshair; }

        /* Modals & Media Panel */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 99; display: none; align-items: center; justify-content: center; }
        .modal-box { background: white; padding: 25px; border-radius: 12px; width: 90%; max-width: 700px; max-height: 80vh; overflow-y: auto; }
        .image-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-top: 15px; }
        .image-grid img { width: 100%; height: 100px; object-fit: cover; border-radius: 6px; cursor: pointer; transition: transform 0.2s; }
        .image-grid img:hover { transform: scale(1.05); }

        /* Office Course Bottom Panel */
        .course-footer { background: white; border-top: 1px solid var(--border-color); padding: 15px 20px; max-height: 180px; overflow-y: auto; }
        .course-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
        .course-card { background: #f8fafc; border: 1px solid #e2e8f0; padding: 10px; border-radius: 6px; font-size: 0.8rem; }
    </style>
</head>
<body>

    <!-- Header / Office Top Ribbon -->
    <div class="ribbon-header">
        <span>🌐 Global Office Presentation & Research Suite</span>
        <select onchange="changeLanguage(this.value)" style="background:#0f172a; color:white; border:none; padding:3px 8px; border-radius:4px;">
            <option value="ar">العربية 🇲🇦</option>
            <option value="fr">Français 🇫🇷</option>
            <option value="en">English 🇬🇧</option>
        </select>
    </div>

    <!-- Navigation Tabs (Ribbon) -->
    <div class="ribbon-tabs">
        <button class="tab-btn active" onclick="switchRibbonTab('home')">الرئيسية (Accueil)</button>
        <button class="tab-btn" onclick="switchRibbonTab('insert')">إدراج (Insertion)</button>
        <button class="tab-btn" onclick="switchRibbonTab('design')">التصميم (Design)</button>
        <button class="tab-btn" onclick="switchRibbonTab('library')">مكتبة الأبحاث والصور</button>
        <button class="tab-btn" onclick="switchRibbonTab('ai')">الذكاء الاصطناعي (AI)</button>
    </div>

    <!-- Toolbar Panels -->
    <!-- 1. Home Tab -->
    <div class="ribbon-toolbar active" id="tab-home">
        <div class="tool-group">
            <div><label>الشرائح</label></div>
            <button class="btn-tool primary" onclick="addSlide()">+ شريحة جديدة</button>
            <button class="btn-tool" onclick="duplicateSlide()">📋 تكرار</button>
        </div>
        <div class="tool-group">
            <div><label>الرسم</label></div>
            <button class="btn-tool" id="drawBtn" onclick="toggleDrawingMode()">✏️ قلم الرسم</button>
            <input type="color" id="penColor" value="#ef4444">
            <button class="btn-tool" onclick="clearCanvas()">🧹 مسح</button>
        </div>
        <div class="tool-group">
            <div><label>العرض والطباعة</label></div>
            <button class="btn-tool" onclick="window.print()">🖨️ تصدير PDF</button>
            <button class="btn-tool primary" onclick="toggleFullscreen()">▶️ بدء العرض</button>
        </div>
    </div>

    <!-- 2. Insert Tab -->
    <div class="ribbon-toolbar" id="tab-insert">
        <div class="tool-group">
            <div><label>الأشكال الهندسة الشاملة</label></div>
            <select class="btn-tool" onchange="addShape(this.value); this.value='';">
                <option value="">-- إدراج شكل هندسي --</option>
                <option value="square">🟦 مربع (Square)</option>
                <option value="circle">🟠 دائرة (Circle)</option>
                <option value="triangle">🔺 مثلث (Triangle)</option>
                <option value="star">⭐ نجمة (Star)</option>
                <option value="arrow">➔ سهم (Arrow)</option>
                <option value="check">✅ صح (Check)</option>
                <option value="diamond">🔷 معين (Diamond)</option>
                <option value="cloud">☁️ سحابة (Cloud)</option>
            </select>
        </div>
        <div class="tool-group">
            <div><label>الوسائط</label></div>
            <input type="file" id="imageInput" accept="image/*" style="display:none;" onchange="uploadImage(event)">
            <button class="btn-tool" onclick="document.getElementById('imageInput').click()">🖼️ من الجهاز</button>
            <button class="btn-tool" onclick="openImageLibrary()">🌐 مكتبة الصور الجاهزة</button>
        </div>
    </div>

    <!-- 3. Design Tab -->
    <div class="ribbon-toolbar" id="tab-design">
        <div class="tool-group">
            <div><label>خلفيات وقوالب احترافية</label></div>
            <button class="btn-tool" onclick="changeBackgroundStyle('')">أبيض هادئ</button>
            <button class="btn-tool" onclick="changeBackgroundStyle('bg-gradient-blue')">تدرج أزرق ملكي</button>
            <button class="btn-tool" onclick="changeBackgroundStyle('bg-gradient-purple')">تدرج بنفسجي</button>
            <button class="btn-tool" onclick="changeBackgroundStyle('bg-gradient-dark')">نمط داكن (Dark)</button>
        </div>
    </div>

    <!-- 4. Research & Library Tab -->
    <div class="ribbon-toolbar" id="tab-library">
        <div class="tool-group">
            <div><label>نماذج عروض ومحتوى جاهز (Presentations)</label></div>
            <button class="btn-tool" onclick="loadResearchPaper('ai_paper')">📄 بحث: الذكاء الاصطناعي</button>
            <button class="btn-tool" onclick="loadResearchPaper('business_plan')">💼 عرض: خطة عمل شركة</button>
            <button class="btn-tool" onclick="loadResearchPaper('scientific_method')">🔬 بحث: المنهج العلمي</button>
        </div>
    </div>

    <!-- 5. AI Tab -->
    <div class="ribbon-toolbar" id="tab-ai">
        <div class="tool-group">
            <div><label>التوليد الآلي</label></div>
            <button class="btn-tool ai-btn" onclick="generateAISlides()">🤖 توليد عرض كامل بالذكاء الاصطناعي</button>
        </div>
    </div>

    <!-- App Body -->
    <div class="app-body">
        <!-- Sidebar -->
        <div class="sidebar">
            <h3>📂 إدارة المشاريع</h3>
            <select id="projectSelect" class="btn-tool" onchange="switchProject(this.value)"></select>
            
            <h3>📜 قائمة الشرائح</h3>
            <div class="slide-list" id="slideList"></div>
        </div>

        <!-- Editor Workspace -->
        <div class="workspace">
            <div class="slide-wrapper">
                <canvas id="drawCanvas"></canvas>
                <div class="shapes-layer" id="shapesContainer"></div>
                <div class="slide-card" id="slideCard">
                    <input type="text" class="title-input" id="slideTitle" placeholder="عنوان الشريحة..." oninput="updateCurrentSlide()">
                    <textarea class="body-input" id="slideBody" placeholder="أدخل محتوى الشريحة أو البحث هنا..." oninput="updateCurrentSlide()"></textarea>
                    <img id="slideImg" class="preview-img" style="display:none;" />
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom Office Tips Panel -->
    <div class="course-footer">
        <h4 style="font-size:0.85rem; margin-bottom:8px; color:var(--primary);">🎓 مكتبة دروس Office Express</h4>
        <div class="course-grid">
            <div class="course-card"><strong>Word:</strong> الأنماط والأنماط التلقائية (Accueil > Styles)</div>
            <div class="course-card"><strong>Excel:</strong> الجداول المنسقة والتحليل (Ctrl + T)</div>
            <div class="course-card"><strong>PowerPoint:</strong> الانتقال المنساب (Transitions > Morph)</div>
        </div>
    </div>

    <!-- Image Library Modal -->
    <div class="modal-overlay" id="imageModal">
        <div class="modal-box">
            <h3>🌐 اختر صورة جاهزة عالية الجودة</h3>
            <div class="image-grid">
                <img src="https://images.unsplash.com/photo-1518770660439-4636190af475?w=500" onclick="selectStockImage(this.src)">
                <img src="https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=500" onclick="selectStockImage(this.src)">
                <img src="https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=500" onclick="selectStockImage(this.src)">
                <img src="https://images.unsplash.com/photo-1507679799987-c73779587ccf?w=500" onclick="selectStockImage(this.src)">
            </div>
            <button class="btn-tool danger" style="margin-top:15px;" onclick="closeImageLibrary()">إغلاق</button>
        </div>
    </div>

    <script>
        /* --- 1. RIBBON TAB SYSTEM --- */
        function switchRibbonTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.ribbon-toolbar').forEach(panel => panel.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(`tab-${tabName}`).classList.add('active');
        }

        /* --- 2. PROJECTS & SLIDE MANAGEMENT --- */
        let projects = JSON.parse(localStorage.getItem('global_office_projects')) || {
            "المشروع العلمي 1": [{ title: "مرحباً بك في المنصة المتقدمة", body: "استخدم التبويبات بالفي أعلى لتصفح الأدوات، إضافة الأشكال، والمستندات الجاهزة.", image: "", bgClass: "" }]
        };
        let currentProjectName = localStorage.getItem('global_current_project') || "المشروع العلمي 1";
        let slides = projects[currentProjectName] || projects[Object.keys(projects)[0]];
        let currentIndex = 0;

        function saveAll() {
            projects[currentProjectName] = slides;
            localStorage.setItem('global_office_projects', JSON.stringify(projects));
            localStorage.setItem('global_current_project', currentProjectName);
        }

        function renderProjectSelect() {
            const select = document.getElementById('projectSelect');
            select.innerHTML = '';
            Object.keys(projects).forEach(name => {
                const opt = document.createElement('option');
                opt.value = name; opt.innerText = name;
                if(name === currentProjectName) opt.selected = true;
                select.appendChild(opt);
            });
        }

        function renderSlideList() {
            const list = document.getElementById('slideList');
            list.innerHTML = '';
            slides.forEach((slide, index) => {
                const thumb = document.createElement('div');
                thumb.className = `slide-thumb ${index === currentIndex ? 'active' : ''}`;
                thumb.onclick = () => selectSlide(index);
                thumb.innerHTML = `<strong>شريحة ${index + 1}</strong>: ${slide.title.substring(0, 15) || 'بدون عنوان'}`;
                list.appendChild(thumb);
            });
        }

        function selectSlide(index) {
            currentIndex = index; loadCurrentSlide(); renderSlideList(); clearCanvas();
        }

        function loadCurrentSlide() {
            const current = slides[currentIndex];
            document.getElementById('slideTitle').value = current.title || '';
            document.getElementById('slideBody').value = current.body || '';
            document.getElementById('slideCard').className = `slide-card ${current.bgClass || ''}`;
            
            const imgEl = document.getElementById('slideImg');
            if (current.image) { imgEl.src = current.image; imgEl.style.display = 'block'; } 
            else { imgEl.style.display = 'none'; }
        }

        function updateCurrentSlide() {
            slides[currentIndex].title = document.getElementById('slideTitle').value;
            slides[currentIndex].body = document.getElementById('slideBody').value;
            saveAll(); renderSlideList();
        }

        function addSlide() {
            slides.push({ title: "شريحة جديدة", body: "", image: "", bgClass: "" });
            currentIndex = slides.length - 1;
            loadCurrentSlide(); renderSlideList(); saveAll();
        }

        function duplicateSlide() {
            const current = slides[currentIndex];
            slides.push(JSON.parse(JSON.stringify(current)));
            currentIndex = slides.length - 1;
            loadCurrentSlide(); renderSlideList(); saveAll();
        }

        function switchProject(name) {
            currentProjectName = name; slides = projects[name]; currentIndex = 0;
            saveAll(); loadCurrentSlide(); renderSlideList();
        }

        /* --- 3. SHAPES & MEDIA --- */
        function addShape(type) {
            if(!type) return;
            const container = document.getElementById('shapesContainer');
            const shape = document.createElement('div');
            shape.className = 'shape-item';
            shape.style.top = '30%'; shape.style.left = '40%';

            if(type === 'square') shape.innerHTML = '<div style="width:70px;height:70px;background:#2563eb;border-radius:6px;"></div>';
            else if(type === 'circle') shape.innerHTML = '<div style="width:70px;height:70px;background:#ec4899;border-radius:50%;"></div>';
            else if(type === 'triangle') shape.innerHTML = '🔺';
            else if(type === 'star') shape.innerHTML = '⭐';
            else if(type === 'arrow') shape.innerHTML = '➔';
            else if(type === 'check') shape.innerHTML = '✅';
            else if(type === 'diamond') shape.innerHTML = '🔷';
            else if(type === 'cloud') shape.innerHTML = '☁️';

            shape.ondblclick = () => shape.remove();
            makeDraggable(shape);
            container.appendChild(shape);
        }

        function makeDraggable(element) {
            let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
            element.onmousedown = (e) => {
                e.preventDefault(); pos3 = e.clientX; pos4 = e.clientY;
                document.onmouseup = () => { document.onmouseup = null; document.onmousemove = null; };
                document.onmousemove = (e) => {
                    e.preventDefault();
                    pos1 = pos3 - e.clientX; pos2 = pos4 - e.clientY;
                    pos3 = e.clientX; pos4 = e.clientY;
                    element.style.top = (element.offsetTop - pos2) + "px";
                    element.style.left = (element.offsetLeft - pos1) + "px";
                };
            };
        }

        function openImageLibrary() { document.getElementById('imageModal').style.display = 'flex'; }
        function closeImageLibrary() { document.getElementById('imageModal').style.display = 'none'; }
        function selectStockImage(url) {
            slides[currentIndex].image = url;
            loadCurrentSlide(); saveAll(); closeImageLibrary();
        }

        function uploadImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) { slides[currentIndex].image = e.target.result; loadCurrentSlide(); saveAll(); };
                reader.readAsDataURL(file);
            }
        }

        function changeBackgroundStyle(className) {
            document.getElementById('slideCard').className = `slide-card ${className}`;
            slides[currentIndex].bgClass = className;
            saveAll();
        }

        /* --- 4. RESEARCH PAPERS & AI GENERATOR --- */
        const researchPapers = {
            ai_paper: [
                { title: "🔬 بحث: الذكاء الاصطناعي والتطور التكنولوجي", body: "ملخص البحث:\nيقدم هذا البحث دراسة شاملة حول أثر الذكاء الاصطناعي في تحسين أداء التطبيقات الحديثة والتحول الرقمي.", image: "https://images.unsplash.com/photo-1518770660439-4636190af475?w=500", bgClass: "bg-gradient-dark" },
                { title: "📊 منهجية الدراسة والنتائج", body: "تم اعتماد المنهج التحليلي المقارن لقياس أداء الخوارزميات وتأثيرها على تجربة المستخدم النهائي.", image: "", bgClass: "" }
            ],
            business_plan: [
                { title: "💼 خطة عمل شركة ناشئة (Business Pitch)", body: "الرؤية والرسالة:\nبناء منصة إنتاجية رقمية تقدم حلولاً خافضة للتكاليف وموجهة للسوق العالمي.", image: "https://images.unsplash.com/photo-1507679799987-c73779587ccf?w=500", bgClass: "bg-gradient-blue" }
            ],
            scientific_method: [
                { title: "🔬 خطوات المنهج العلمي الحديث", body: "1. الملاحظة وصياغة المشكلة.\n2. وضع الفرضيات العلمية.\n3. التجربة والتحليل والاستنتاج.", image: "", bgClass: "bg-gradient-purple" }
            ]
        };

        function loadResearchPaper(type) {
            if (confirm("هل تريد تحميل هذا البحث / العرض الجاهز؟")) {
                slides = JSON.parse(JSON.stringify(researchPapers[type]));
                currentIndex = 0; saveAll(); loadCurrentSlide(); renderSlideList();
            }
        }

        function generateAISlides() {
            const topic = prompt("أدخل عنوان البحث أو موضوع العرض التقديمي:");
            if (!topic) return;
            slides = [
                { title: `🎓 بحث / عرض: ${topic}`, body: `دراسة تحليلية ومقدمة شاملة موضوع : ${topic}.\nتم الإنشاء تلقائياً عبر المحرك الذكي.`, image: "https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=500", bgClass: "bg-gradient-dark" },
                { title: "📌 المحاور الرئيسية", body: "• المحور الأول: المفاهيم والأسس.\n• المحور الثاني: التحديات والفرص.\n• المحور الثالث: التوصيات المستقبلية.", image: "", bgClass: "" }
            ];
            currentIndex = 0; saveAll(); loadCurrentSlide(); renderSlideList();
        }

        /* --- 5. CANVAS & FULLSCREEN --- */
        const canvas = document.getElementById('drawCanvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false, drawingActive = false;

        function resizeCanvas() {
            const wrapper = document.querySelector('.slide-wrapper');
            canvas.width = wrapper.clientWidth; canvas.height = wrapper.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);

        function toggleDrawingMode() {
            drawingActive = !drawingActive;
            canvas.classList.toggle('active', drawingActive);
        }

        canvas.addEventListener('mousedown', (e) => {
            if(!drawingActive) return;
            isDrawing = true; ctx.beginPath(); ctx.moveTo(e.offsetX, e.offsetY);
        });

        canvas.addEventListener('mousemove', (e) => {
            if (isDrawing && drawingActive) {
                ctx.lineTo(e.offsetX, e.offsetY);
                ctx.strokeStyle = document.getElementById('penColor').value;
                ctx.lineWidth = 3; ctx.stroke();
            }
        });

        canvas.addEventListener('mouseup', () => isDrawing = false);
        function clearCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

        function toggleFullscreen() {
            const elem = document.querySelector('.slide-wrapper');
            if (elem.requestFullscreen) elem.requestFullscreen();
        }

        function changeLanguage(lang) {
            document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
        }

        /* Init */
        renderProjectSelect(); renderSlideList(); loadCurrentSlide();
        setTimeout(resizeCanvas, 300);
    </script>
</body>
</html>
