<!-- أضف هذه الخيارات داخل شريط الأدوات (toolbar) -->
<label>انحناء الزوايا:</label>
<input type="range" min="0" max="40" value="8" onchange="changeRadius(this.value)">

<label>فلتر الصورة:</label>
<select onchange="applyImageFilter(this.value)">
    <option value="none">عادي</option>
    <option value="grayscale(100%)">أبيض وأسود</option>
    <option value="sepia(100%)">دافئ / Vintage</option>
    <option value="brightness(130%)">سطوع قوي</option>
</select>

<button onclick="toggleGlassEffect()">✨ تأثير زجاجي</button>

<script>
    /* 5. تأثير الزجاج الضبابي */
    function toggleGlassEffect() {
        let card = document.getElementById('slideCard');
        card.style.backdropFilter = card.style.backdropFilter ? "" : "blur(10px)";
        card.style.background = card.style.backdropFilter ? "rgba(255, 255, 255, 0.4)" : "#ffffff";
    }

    /* 6. تحكم انحناء الزوايا */
    function changeRadius(val) {
        document.getElementById('slideCard').style.borderRadius = val + 'px';
        slides[currentIndex].borderRadius = val;
        saveToStorage();
    }

    /* 7. فلاتر الصور */
    function applyImageFilter(filter) {
        document.getElementById('slideImg').style.filter = filter;
        slides[currentIndex].imgFilter = filter;
        saveToStorage();
    }
</script>
