<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Slides AI & Office Pro Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-light: #f8fafc;
            --bg-dark: #0f172a;
            --card-light: rgba(255, 255, 255, 0.85);
            --card-dark: rgba(30, 41, 59, 0.85);
            --text-light: #0f172a;
            --text-dark: #f8fafc;
            --accent: #ec4899;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', 'Poppins', sans-serif; transition: background 0.2s, color 0.2s; }
        body { display: flex; flex-direction: column; min-height: 100vh; background: var(--bg-light); color: var(--text-light); }
        body.dark-mode { background: var(--bg-dark); color: var(--text-dark); }

        .app-container { display: flex; flex: 1; height: calc(100vh - 60px); }

        /* Sidebar - شريط جانبى متطور */
        .sidebar { width: 320px; background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(15px); border-left: 1px solid rgba(226, 232, 240, 0.8); display: flex; flex-direction: column; padding: 20px; gap: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.03); }
        body.dark-mode .sidebar { background: rgba(30, 41, 59, 0.6); border-color: rgba(51, 65, 85, 0.8); }
        .sidebar h2 { font-size: 1.1rem; font-weight: 700; color: var(--primary); text-transform: uppercase; letter-spacing: 0.5px; }

        .project-manager { display: flex; flex-direction: column; gap: 8px; padding-bottom: 12px; border-bottom: 1px solid #cbd5e1; }
        .project-manager select, .project-manager input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.85rem; outline: none; background: rgba(255,255,255,0.9); }
        body.dark-mode .project-manager select, body.dark-mode .project-manager input { background: #334155; color: #fff; border-color: #475569; }

        .slide-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-left: 4px; }
        .slide-thumb { padding: 12px; border: 2px solid #e2e8f0; border-radius: 10px; cursor: pointer; background: rgba(255, 255, 255, 0.5); position: relative; transition: all 0.2s; }
        .slide-thumb:hover { border-color: var(--primary); transform: translateY(-2px); }
        .slide-thumb.active { border-color: var(--primary); background: rgba(99, 102, 241, 0.1); box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2); }
        .slide-thumb .controls { position: absolute; left: 8px; top: 8px; display: flex; gap: 4px; }
        .slide-thumb button { background: none; border: none; cursor: pointer; font-size: 0.85rem; opacity: 0.7; }
        .slide-thumb button:hover { opacity: 1; }

        /* Main Area & Toolbar */
        .main-content { flex: 1; display: flex; flex-direction: column; }
        .toolbar { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(12px); border-bottom: 1px solid #e2e8f0; padding: 12px 20px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; box-shadow: 0 4px 15px rgba(0,0,0,0.02); }
        body.dark-mode .toolbar { background: rgba(30, 41, 59, 0.7); border-color: #334155; }
        
        .toolbar select, .toolbar button, .toolbar input[type="color"], .toolbar input[type="range"] { padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 8px; background: #fff; cursor: pointer; font-size: 0.82rem; font-weight: 600; }
        body.dark-mode .toolbar select, body.dark-mode .toolbar button { background: #334155; color: #fff; border-color: #475569; }
        .toolbar button.btn-ai { background: linear-gradient(135deg, #a855f7, #ec4899); color: white; border: none; box-shadow: 0 4px 12px rgba(236, 72, 153, 0.3); }
        .toolbar button.primary { background: var(--primary); color: white; border: none; }
        .toolbar button.primary:hover { background: var(--primary-hover); }
        .toolbar button.success { background: #10b981; color: white; border: none; }
        .toolbar button.danger { background: #ef4444; color: white; border: none; }

        /* Slide Editor Screen */
        .editor-area { flex: 1; padding: 30px; display: flex; flex-direction: column; justify-content: center; align-items: center; overflow-y: auto; position: relative; }
        .slide-card-wrapper { position: relative; width: 100%; max-width: 850px; aspect-ratio: 16/9; }
        
        .slide-card { width: 100%; height: 100%; background: var(--card-light); backdrop-filter: blur(20px); box-shadow: 0 20px 40px rgba(0,0,0,0.08); border: 1px solid rgba(255,255,255,0.4); border-radius: 16px; padding: 40px; display: flex; flex-direction: column; justify-content: center; gap: 15px; position: relative; text-align: right; overflow: hidden; }
        body.dark-mode .slide-card { background: var(--card-dark); border-color: rgba(255,255,255,0.1); }
        
        /* Predefined Gradients */
        .bg-gradient-blue { background: linear-gradient(135deg, #3b82f6 0%, #1e40af 100%) !important; color: white !important; }
        .bg-gradient-purple { background: linear-gradient(135deg, #a855f7 0%, #6b21a8 100%) !important; color: white !important; }
        .bg-gradient-neon { background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 50%, #8b5cf6 100%) !important; color: white !important; }
        .bg-gradient-sunset { background: linear-gradient(135deg, #f97316 0%, #ec4899 100%) !important; color: white !important; }

        .slide-card input, .slide-card textarea { width: 100%; border: 1px dashed transparent; padding: 8px; background: transparent; color: inherit; font-family: inherit; border-radius: 6px; }
        .slide-card input:focus, .slide-card textarea:focus { border-color: var(--primary); outline: none; background: rgba(99, 102, 241, 0.05); }
        .slide-card input.title-input { font-size: 2.2rem; font-weight: 900; }
        .slide-card textarea.body-input { font-size: 1.1rem; resize: none; height: 130px; line-height: 1.6; }
        .slide-card img.preview-img { max-height: 180px; object-fit: contain; border-radius: 8px; margin: 0 auto; }

        /* Shapes Container */
        .shapes-container { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
        .added-shape { position: absolute; pointer-events: auto; cursor: move; display: flex; align-items: center; justify-content: center; user-select: none; }

        /* Canvas Drawing */
        #drawCanvas { position: absolute; inset: 0; z-index: 10; pointer-events: none; border-radius: 16px; }
        #drawCanvas.drawing-active { pointer-events: auto; cursor: crosshair; }

        /* Office Pro Course Section */
        .course-section { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); padding: 50px 20px; border-top: 1px solid #e2e8f0; }
        body.dark-mode .course-section { background: rgba(30, 41, 59, 0.8); border-color: #334155; }
        .course-container { max-width: 1000px; margin: 0 auto; }
        .course-section h2 { text-align: center; margin-bottom: 25px; font-size: 1.6rem; font-weight: 800; color: var(--primary); }
        .tabs { display: flex; gap: 12px; justify-content: center; margin-bottom: 25px; }
        .tab-btn { padding: 10px 22px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; color: white; opacity: 0.8; }
        .tab-btn.active { opacity: 1; transform: translateY(-2px); box-shadow: 0 4px 15px rgba(0,0,0,0.15); }
        .btn-word { background-color: #2563eb; }
        .btn-excel { background-color: #10b981; }
        .btn-ppt { background-color: #f97316; }
        .search-box { margin-bottom: 25px; text-align: center; }
        .search-box input { width: 100%; max-width: 500px; padding: 12px 18px; border: 1px solid #cbd5e1; border-radius: 25px; outline: none; }
        .course-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .card { background: #f8fafc; border-radius: 12px; padding: 20px; border-top: 4px solid #ccc; box-shadow: 0 4px 10px rgba(0,0,0,0.03); }
        body.dark-mode .card { background: #334155; color: #fff; }
        .card.word { border-top-color: #2563eb; }
        .card.excel { border-top-color: #10b981; }
        .card.ppt { border-top-color: #f97316; }
        .card h3 { font-size: 1.1rem; margin-bottom: 8px; }
        .card p { font-size: 0.88rem; opacity: 0.8; margin-bottom: 12px; }
        .shortcut-badge { background: #e2e8f0; padding: 4px 8px; border-radius: 6px; font-family: monospace; font-size: 0.8rem; font-weight: 700; color: #0f172a; }
        body.dark-mode .shortcut-badge { background: #475569; color: #fff; }
        .copy-btn { float: left; background: none; border: none; color: var(--primary); cursor: pointer; font-weight: 700; }

        @media print {
            .sidebar, .toolbar, .course-section, #drawCanvas { display: none !important; }
            body { background: white !important; color: black !important; }
            .editor-area { padding: 0 !important; }
            .slide-card-wrapper { max-width: 100% !important; height: 100vh !important; }
            .slide-card { box-shadow: none !important; border-radius: 0 !important; page-break-after: always; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <h2 id="txtProjects">📁 المشاريع</h2>
            <div class="project-manager">
                <select id="projectSelect" onchange="switchProject(this.value)"></select>
                <div style="display:flex; gap:5px;">
                    <input type="text" id="newProjectName" placeholder="مشروع جديد...">
                    <button class="primary" onclick="createProject()">+</button>
                </div>
            </div>

            <h2 id="txtSlides">📜 الشرائح</h2>
            <div class="slide-list" id="slideList"></div>
            <button class="primary" onclick="addSlide()" id="btnAddSlide">+ شريحة جديدة</button>
        </div>

        <!-- Main Content Area -->
        <div class="main-content">
            <div class="toolbar">
                <!-- AI & Generator -->
                <button class="btn-ai" onclick="generateAISlides()">🤖 إنشاء بالذكاء الاصطناعي</button>

                <!-- Languages -->
                <select onchange="changeLanguage(this.value)">
                    <option value="ar">العربية 🇲🇦</option>
                    <option value="fr">Français 🇫🇷</option>
                    <option value="en">English 🇬🇧</option>
                </select>

                <!-- Preset Models Wajdin -->
                <select onchange="loadPresetPresentation(this.value); this.value='';">
                    <option value="">-- نماذج جاهزة Wajdin --</option>
                    <option value="startup">🚀 مشروع / Startup</option>
                    <option value="course">🎓 عرض تعليمي</option>
                    <option value="report">💼 تقرير عمل</option>
                </select>

                <!-- Shapes -->
                <select onchange="addShape(this.value); this.value='';">
                    <option value="">-- إدراج شكل --</option>
                    <option value="square">🟦 مربع</option>
                    <option value="circle">🟠 دائرة</option>
                    <option value="triangle">🔺 مثلث</option>
                    <option value="star">⭐ نجمة</option>
                    <option value="arrow">➔ سهم</option>
                    <option value="check">✅ علامة صح</option>
                </select>

                <!-- Gradients Backgrounds -->
                <select onchange="changeBackgroundStyle(this.value)">
                    <option value="">خلفية هادئة</option>
                    <option value="bg-gradient-blue">تدرج أزرق ملكي</option>
                    <option value="bg-gradient-purple">تدرج بنفسجي سحري</option>
                    <option value="bg-gradient-neon">تدرج نيون عصري</option>
                    <option value="bg-gradient-sunset">تدرج الغروب</option>
                </select>

                <!-- Images & Filters -->
                <input type="file" id="imageInput" accept="image/*" style="display:none;" onchange="uploadImage(event)">
                <button onclick="document.getElementById('imageInput').click()">🖼️️ صورة</button>
                <button class="danger" onclick="removeImage()">🗑️ حذف صورة</button>

                <!-- Draw Tool & Colors -->
                <button id="drawBtn" onclick="toggleDrawingMode()">✏️ رسم</button>
                <input type="color" id="penColor" value="#ef4444" title="لون القلم">
                <button onclick="clearCanvas()">🧹 مسح الرسم</button>

                <!-- Effects & Dark Mode -->
                <button onclick="toggleGlassEffect()">✨ زجاج</button>
                <button onclick="toggleLaser()">🎯 ليزر</button>
                <button onclick="toggleTheme()">🎨 المظهر</button>

                <button class="success" onclick="window.print()">🖨️ PDF</button>
                <button class="primary" onclick="toggleFullscreen()">▶️ عرض كامل</button>
            </div>

            <div class="editor-area">
                <div class="slide-card-wrapper">
                    <canvas id="drawCanvas"></canvas>
                    <div class="shapes-container" id="shapesContainer"></div>
                    <div class="slide-card" id="slideCard">
                        <input type="text" class="title-input" id="slideTitle" placeholder="عنوان الشريحة..." oninput="updateCurrentSlide()">
                        <textarea class="body-input" id="slideBody" placeholder="اكتب محتوى الشريحة هنا..." oninput="updateCurrentSlide()"></textarea>
                        <img id="slideImg" class="preview-img" style="display:none;" />
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Office Course Section -->
    <div class="course-section">
        <div class="course-container">
            <h2>🎓 دورة احتراف Office Pro السريعة</h2>
            <div class="tabs">
                <button class="tab-btn btn-word active" onclick="filterSoftware('word')">📄 Word</button>
                <button class="tab-btn btn-excel" onclick="filterSoftware('excel')">📊 Excel</button>
                <button class="tab-btn btn-ppt" onclick="filterSoftware('ppt')">📙 PowerPoint</button>
            </div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔎 بحث عن اختصار، صيغة، أو حيلة..." onkeyup="searchCourse()">
            </div>
            <div class="course-grid" id="courseGrid"></div>
        </div>
    </div>

    <script>
        /* --- 1. الذكاء الاصطناعي (AI SLIDE GENERATOR - MOCK) --- */
        function generateAISlides() {
            const topic = prompt("أدخل موضوع العرض التقديمي (مثال: الذكاء الاصطناعي، التسويق الرقمي، الطاقة النظيفة):");
            if (!topic) return;

            slides = [
                { title: `🚀 ${topic}`, body: `عرض تقديمي شامل حول : ${topic}\nتم إنشاؤه بواسطة الذكاء الاصطناعي الخاص بالمنصة.`, image: "", bgClass: "bg-gradient-neon" },
                { title: "📌 الأهمية والأهداف", body: "1. فهم المفاهيم الأساسية والأهمية.\n2. تحسين الإنتاجية والكفاءة العالية.\n3. تطبيق أفضل الممارسات العالمية.", image: "", bgClass: "" },
                { title: "💡 الحلول والاستراتيجيات", body: "تطوير أدوات مبتكرة تعتمد على أحدث التقنيات لضمان تحقيق أفضل النتائج الممكنة.", image: "", bgClass: "bg-gradient-blue" },
                { title: "🎯 الخلاصة والتوصيات", body: "شكراً لمتابعتكم! نوصي بالبدء بالخطوات الأولى فوراً لتحقيق النجاح المطلوب.", image: "", bgClass: "" }
            ];
            currentIndex = 0;
            saveAll();
            loadCurrentSlide();
            renderSlideList();
        }

        /* --- 2. MULTILINGUAL ENGINE (تعدد اللغات) --- */
        const translations = {
            ar: { projects: "📁 المشاريع", slides: "📜 الشرائح", addSlide: "+ شريحة جديدة" },
            fr: { projects: "📁 Projets", slides: "📜 Diapositives", addSlide: "+ Nouvelle Diapo" },
            en: { projects: "📁 Projects", slides: "📜 Slides", addSlide: "+ New Slide" }
        };

        function changeLanguage(lang) {
            document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
            document.documentElement.lang = lang;
            document.getElementById('txtProjects').innerText = translations[lang].projects;
            document.getElementById('txtSlides').innerText = translations[lang].slides;
            document.getElementById('btnAddSlide').innerText = translations[lang].addSlide;
        }

        /* --- 3. PROJECT & SLIDE MANAGEMENT --- */
        let projects = JSON.parse(localStorage.getItem('app_projects')) || {
            "المشروع الأول": [{ title: "مرحباً بك في المنصة العالمية", body: "استخدم زر الذكاء الاصطناعي أو اختر نموذجاً جاهزاً للبدء!", image: "", bgClass: "" }]
        };
        let currentProjectName = localStorage.getItem('current_project') || "المشروع الأول";
        let slides = projects[currentProjectName] || projects[Object.keys(projects)[0]];
        let currentIndex = 0;

        function saveAll() {
            projects[currentProjectName] = slides;
            localStorage.setItem('app_projects', JSON.stringify(projects));
            localStorage.setItem('current_project', currentProjectName);
        }

        function renderProjectSelect() {
            const select = document.getElementById('projectSelect');
            select.innerHTML = '';
            Object.keys(projects).forEach(name => {
                const opt = document.createElement('option');
                opt.value = name; opt.innerText = name;
                if(name === currentProjectName) opt.selected = true;
                select.appendChild(opt);
            });
        }

        function createProject() {
            const input = document.getElementById('newProjectName');
            const name = input.value.trim();
            if(name && !projects[name]) {
                projects[name] = [{ title: "عرض جديد", body: "محتوى الشريحة...", image: "", bgClass: "" }];
                currentProjectName = name; slides = projects[name]; currentIndex = 0;
                input.value = '';
                saveAll(); renderProjectSelect(); loadCurrentSlide(); renderSlideList();
            }
        }

        function switchProject(name) {
            currentProjectName = name; slides = projects[name]; currentIndex = 0;
            saveAll(); loadCurrentSlide(); renderSlideList();
        }

        function renderSlideList() {
            const list = document.getElementById('slideList');
            list.innerHTML = '';
            slides.forEach((slide, index) => {
                const thumb = document.createElement('div');
                thumb.className = `slide-thumb ${index === currentIndex ? 'active' : ''}`;
                thumb.onclick = () => selectSlide(index);
                thumb.innerHTML = `
                    <strong>شريحة ${index + 1}</strong>: ${slide.title.substring(0, 14) || 'بدون عنوان'}
                    <div class="controls">
                        <button onclick="event.stopPropagation(); deleteSlide(${index})">🗑️</button>
                    </div>
                `;
                list.appendChild(thumb);
            });
        }

        function selectSlide(index) {
            currentIndex = index; loadCurrentSlide(); renderSlideList(); clearCanvas();
        }

        function loadCurrentSlide() {
            const current = slides[currentIndex];
            document.getElementById('slideTitle').value = current.title || '';
            document.getElementById('slideBody').value = current.body || '';
            document.getElementById('slideCard').className = `slide-card ${current.bgClass || ''}`;
            
            const imgEl = document.getElementById('slideImg');
            if (current.image) { 
                imgEl.src = current.image; 
                imgEl.style.display = 'block'; 
            } else { 
                imgEl.style.display = 'none'; 
            }
        }

        function updateCurrentSlide() {
            slides[currentIndex].title = document.getElementById('slideTitle').value;
            slides[currentIndex].body = document.getElementById('slideBody').value;
            saveAll(); renderSlideList();
        }

        function addSlide() {
            slides.push({ title: "شريحة جديدة", body: "", image: "", bgClass: "" });
            currentIndex = slides.length - 1;
            loadCurrentSlide(); renderSlideList(); saveAll();
        }

        function deleteSlide(index) {
            if (slides.length <= 1) return;
            slides.splice(index, 1);
            if (currentIndex >= slides.length) currentIndex = slides.length - 1;
            loadCurrentSlide(); renderSlideList(); saveAll();
        }

        /* --- 4. MODEL WAJDIN PRESETS --- */
        const presetPresentations = {
            startup: [
                { title: "🚀 مشروع واعد", body: "الحل الذكي والابتكاري لعالم أفضل.\nإعداد الفريق المطور", image: "", bgClass: "bg-gradient-neon" },
                { title: "🎯 المشكلة والفرصة", body: "1. تعقيد الممارسات التقليدية.\n2. ارتفاع التكاليف.\n3. الحاجة إلى حلول سريعة وسحابة.", image: "", bgClass: "" },
                { title: "💡 الحل المبتكر", body: "منصة ذكية وشاملة تتيح للمستخدمين إنجاز أعمالهم بأقل جهد ممكن.", image: "", bgClass: "bg-gradient-blue" }
            ],
            course: [
                { title: "🎓 عنوان العرض التعليمي", body: "مادة البحث العلمي والتكنولوجيا الحديثة\nإعداد الطالب / الباحث", image: "", bgClass: "bg-gradient-purple" },
                { title: "📌 المقدمة", body: "تحديد الفرضيات ومراجعة المفاهيم العلمية الأساسية للموضوع.", image: "", bgClass: "" }
            ],
            report: [
                { title: "💼 التقرير السنوي", body: "مراجعة الأداء المالي والتشغيلي والمؤشرات الرئيسية.", image: "", bgClass: "bg-gradient-sunset" },
                { title: "📈 النتائج الإيجابية", body: "• نسبة النمو : +25%\n• الرضا العام : 95%", image: "", bgClass: "" }
            ]
        };

        function loadPresetPresentation(type) {
            if (!type || !presetPresentations[type]) return;
            if (confirm("هل تريد تحميل هذا النموذج الجاهز؟")) {
                slides = JSON.parse(JSON.stringify(presetPresentations[type]));
                currentIndex = 0;
                saveAll(); loadCurrentSlide(); renderSlideList();
            }
        }

        /* --- 5. SHAPES & CANVAS DRAWING --- */
        function addShape(type) {
            if(!type) return;
            const container = document.getElementById('shapesContainer');
            const shape = document.createElement('div');
            shape.className = 'added-shape';
            shape.style.top = '40%'; shape.style.left = '40%';

            if(type === 'square') { shape.style.width = '70px'; shape.style.height = '70px'; shape.style.backgroundColor = '#6366f1'; shape.style.borderRadius = '8px'; } 
            else if(type === 'circle') { shape.style.width = '70px'; shape.style.height = '70px'; shape.style.backgroundColor = '#ec4899'; shape.style.borderRadius = '50%'; } 
            else if(type === 'triangle') { shape.innerHTML = '🔺'; shape.style.fontSize = '60px'; } 
            else if(type === 'star') { shape.innerHTML = '⭐'; shape.style.fontSize = '60px'; } 
            else if(type === 'arrow') { shape.innerHTML = '➔'; shape.style.fontSize = '60px'; shape.style.color = '#10b981'; } 
            else if(type === 'check') { shape.innerHTML = '✅'; shape.style.fontSize = '50px'; }

            shape.ondblclick = () => shape.remove();
            makeDraggable(shape);
            container.appendChild(shape);
        }

        function makeDraggable(element) {
            let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
            element.onmousedown = (e) => {
                e.preventDefault(); pos3 = e.clientX; pos4 = e.clientY;
                document.onmouseup = () => { document.onmouseup = null; document.onmousemove = null; };
                document.onmousemove = (e) => {
                    e.preventDefault();
                    pos1 = pos3 - e.clientX; pos2 = pos4 - e.clientY;
                    pos3 = e.clientX; pos4 = e.clientY;
                    element.style.top = (element.offsetTop - pos2) + "px";
                    element.style.left = (element.offsetLeft - pos1) + "px";
                };
            };
        }

        function changeBackgroundStyle(className) {
            document.getElementById('slideCard').className = `slide-card ${className}`;
            slides[currentIndex].bgClass = className;
            saveAll();
        }

        const canvas = document.getElementById('drawCanvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false, drawingModeActive = false;

        function resizeCanvas() {
            const wrapper = document.querySelector('.slide-card-wrapper');
            canvas.width = wrapper.clientWidth; canvas.height = wrapper.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);

        function toggleDrawingMode() {
            drawingModeActive = !drawingModeActive;
            const btn = document.getElementById('drawBtn');
            if(drawingModeActive) { canvas.classList.add('drawing-active'); btn.style.background = '#8b5cf6'; btn.style.color = '#fff'; } 
            else { canvas.classList.remove('drawing-active'); btn.style.background = ''; btn.style.color = ''; }
        }

        canvas.addEventListener('mousedown', (e) => {
            if(!drawingModeActive) return;
            isDrawing = true; ctx.beginPath(); ctx.moveTo(e.offsetX, e.offsetY);
        });

        canvas.addEventListener('mousemove', (e) => {
            if (isDrawing && drawingModeActive) {
                ctx.lineTo(e.offsetX, e.offsetY); 
                ctx.strokeStyle = document.getElementById('penColor').value; 
                ctx.lineWidth = 3; 
                ctx.stroke();
            }
        });

        canvas.addEventListener('mouseup', () => isDrawing = false);
        function clearCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

        /* --- 6. UTILITIES & OFFICE COURSES --- */
        function uploadImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) { slides[currentIndex].image = e.target.result; loadCurrentSlide(); saveAll(); };
                reader.readAsDataURL(file);
            }
        }

        function removeImage() { slides[currentIndex].image = ""; loadCurrentSlide(); saveAll(); }
        function toggleGlassEffect() {
            let card = document.getElementById('slideCard');
            card.style.backdropFilter = card.style.backdropFilter ? "" : "blur(15px)";
        }
        function toggleLaser() { document.body.style.cursor = document.body.style.cursor === 'crosshair' ? 'default' : 'crosshair'; }
        function toggleTheme() { document.body.classList.toggle('dark-mode'); }
        function toggleFullscreen() {
            const elem = document.querySelector('.slide-card-wrapper');
            if (elem.requestFullscreen) elem.requestFullscreen();
        }

        const courses = [
            { id: 1, software: 'word', title: '1. التنسيق التلقائي للأنماط', desc: 'حدد تسلسل العناوين لتأطير المستند وإنشاء فهرس تلقائي.', code: 'الصفحة الرئيسية > الأنماط' },
            { id: 2, software: 'word', title: '2. جدول المحتويات التلقائي', desc: 'أنشئ فهرساً تفاعلياً يتحدث بضغطة زر واحدة.', code: 'مراجع > جدول المحتويات' },
            { id: 3, software: 'excel', title: '1. الجداول المنسقة (Structured Table)', desc: 'حول بياناتك إلى جدول تفاعلي ذكي يوسع الفلاتر والدوال تلقائياً.', code: 'Ctrl + T (أو Ctrl + L)' },
            { id: 4, software: 'excel', title: '2. الجداول المحورية (Pivot Table)', desc: 'حلل ملايين البيانات ودمجها بمرونة دون كتابة معادلة واحدة.', code: 'إدراج > PivotTable' },
            { id: 5, software: 'ppt', title: '1. الشريحة الرئيسية (Slide Master)', desc: 'خصص تصميم ولوجو الخط لكل الشرايح بضغطة واحدة.', code: 'عرض > الشريحة الرئيسية' },
            { id: 6, software: 'ppt', title: '2. الانتقال المنساب (Morph)', desc: 'أنشئ تحريكات بصرية وانتقالات احترافية بين الشرائح.', code: 'انتقالات > التحويل التدريجي' }
        ];

        let currentFilter = 'word';

        function renderCourses() {
            const grid = document.getElementById('courseGrid');
            const searchText = document.getElementById('searchInput').value.toLowerCase();
            grid.innerHTML = '';

            const filtered = courses.filter(item => {
                const matchesTab = item.software === currentFilter;
                const matchesSearch = item.title.toLowerCase().includes(searchText) || item.desc.toLowerCase().includes(searchText) || item.code.toLowerCase().includes(searchText);
                return matchesTab && matchesSearch;
            });

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = `card ${item.software}`;
                card.innerHTML = `
                    <h3>${item.title}</h3>
                    <p>${item.desc}</p>
                    <div>
                        <span class="shortcut-badge">${item.code}</span>
                        <button class="copy-btn" onclick="copyToClipboard('${item.code}')">نسخ</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterSoftware(software) {
            currentFilter = software;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderCourses();
        }

        function searchCourse() { renderCourses(); }
        function copyToClipboard(text) { navigator.clipboard.writeText(text); alert('تم النسخ: ' + text); }

        /* Initial Setup */
        renderProjectSelect(); renderSlideList(); loadCurrentSlide(); renderCourses();
        setTimeout(resizeCanvas, 300);
    </script>
</body>
</html>
