<!-- خيارات الحفظ والمشاركة -->
<button onclick="generateShareLink()">🔗 رابط مشاركة</button>
<button onclick="saveCustomTemplate()">⭐ حفظ كقالب</button>

<script>
    /* 18. توليد رابط المشاركة */
    function generateShareLink() {
        let data = btoa(encodeURIComponent(JSON.stringify(slides)));
        let shareableURL = window.location.origin + window.location.pathname + "#data=" + data;
        navigator.clipboard.writeText(shareableURL);
        alert("تم نسخ رابط المشاركة الخاص بالعرض!");
    }

    /* 17. حفظ كقالب خاص */
    function saveCustomTemplate() {
        let customTemplates = JSON.parse(localStorage.getItem('custom_templates')) || [];
        customTemplates.push(slides[currentIndex]);
        localStorage.setItem('custom_templates', JSON.stringify(customTemplates));
        alert("تم حفظ الشريحة كقالب خاص بك!");
    }
</script>
