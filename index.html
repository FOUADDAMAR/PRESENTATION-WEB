<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presentation Pro Ultimate Suite</title>
    <!-- Fonts & Icons & Chart.js -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-main: #070a13;
            --panel-bg: rgba(15, 23, 42, 0.9);
            --card-bg: rgba(30, 41, 59, 0.75);
            --border-glass: rgba(255, 255, 255, 0.12);
            --accent-cyan: #06b6d4;
            --accent-indigo: #6366f1;
            --accent-pink: #ec4899;
            --accent-amber: #f59e0b;
            --accent-emerald: #10b981;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background: var(--bg-main); color: var(--text-primary); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* Top Header */
        .header-nav {
            background: rgba(11, 17, 32, 0.95);
            border-bottom: 1px solid var(--border-glass);
            padding: 8px 16px;
            display: flex; align-items: center; justify-content: space-between;
            backdrop-filter: blur(12px); z-index: 100;
        }
        .brand {
            font-size: 1.1rem; font-weight: 900;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-indigo), var(--accent-pink));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            display: flex; align-items: center; gap: 8px;
        }

        /* Ribbon Navbar System */
        .ribbon-container { background: rgba(15, 23, 42, 0.95); border-bottom: 1px solid var(--border-glass); }
        .ribbon-tabs { display: flex; gap: 4px; padding: 4px 12px 0 12px; overflow-x: auto; }
        .tab-btn {
            background: transparent; border: none; color: var(--text-secondary);
            padding: 8px 14px; font-weight: 700; font-size: 0.8rem; cursor: pointer;
            border-radius: 8px 8px 0 0; transition: all 0.2s; display: flex; align-items: center; gap: 6px; white-space: nowrap;
        }
        .tab-btn:hover { color: var(--text-primary); background: rgba(255,255,255,0.05); }
        .tab-btn.active { color: var(--accent-cyan); background: rgba(6, 182, 212, 0.12); border-bottom: 2px solid var(--accent-cyan); }

        .ribbon-toolbar { padding: 8px 16px; display: none; gap: 12px; align-items: center; flex-wrap: wrap; background: rgba(10, 15, 29, 0.6); }
        .ribbon-toolbar.active { display: flex; }

        .tool-group { display: flex; align-items: center; gap: 6px; padding-left: 10px; border-left: 1px solid var(--border-glass); }
        .tool-group:last-child { border-left: none; }

        /* UI Buttons & Controls */
        .btn {
            background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-glass);
            color: var(--text-primary); padding: 5px 10px; border-radius: 6px; font-size: 0.78rem;
            font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 5px; transition: all 0.2s;
        }
        .btn:hover { background: rgba(255, 255, 255, 0.15); border-color: var(--accent-cyan); }
        .btn-cyan { background: linear-gradient(135deg, var(--accent-cyan), #0891b2); color: white; border: none; }
        .btn-indigo { background: linear-gradient(135deg, var(--accent-indigo), #4f46e5); color: white; border: none; }
        .btn-amber { background: linear-gradient(135deg, var(--accent-amber), #d97706); color: white; border: none; }
        .btn-emerald { background: linear-gradient(135deg, var(--accent-emerald), #059669); color: white; border: none; }
        .btn-pink { background: linear-gradient(135deg, var(--accent-pink), #be185d); color: white; border: none; }

        /* Main Workspace Structure */
        .workspace { display: flex; flex: 1; height: calc(100vh - 105px); overflow: hidden; }

        /* Left Slides Navigator */
        .sidebar-slides { width: 220px; background: var(--panel-bg); border-left: 1px solid var(--border-glass); padding: 12px; display: flex; flex-direction: column; gap: 10px; }
        .slides-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .slide-thumb {
            background: rgba(255,255,255,0.03); border: 1px solid var(--border-glass);
            border-radius: 8px; padding: 10px; cursor: pointer; transition: all 0.2s; font-size: 0.78rem;
        }
        .slide-thumb.active { border-color: var(--accent-cyan); background: rgba(6, 182, 212, 0.15); font-weight: 700; }

        /* Canvas Stage */
        .stage { flex: 1; background: radial-gradient(circle at center, #111827 0%, #030712 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 15px; overflow-y: auto; position: relative; }
        
        .slide-wrapper { width: 100%; max-width: 850px; aspect-ratio: 16/9; position: relative; }
        .slide-card {
            width: 100%; height: 100%; background: var(--card-bg); backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass); border-radius: 16px; padding: 25px;
            display: flex; flex-direction: column; gap: 10px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            position: relative; overflow-y: auto; transition: background 0.3s;
        }

        .slide-title-input { background: transparent; border: none; outline: none; color: var(--text-primary); font-size: 1.5rem; font-weight: 800; border-bottom: 2px dashed rgba(255,255,255,0.1); padding-bottom: 6px; }
        
        .editable-body {
            background: transparent; border: none; outline: none; color: var(--text-primary);
            font-size: 0.95rem; line-height: 1.7; min-height: 100px; flex: 1; overflow-y: auto;
        }

        .dynamic-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.8rem; }
        .dynamic-table th, .dynamic-table td { border: 1px solid var(--border-glass); padding: 8px; text-align: center; background: rgba(0,0,0,0.2); color: var(--text-primary); }
        .dynamic-table th { background: rgba(6, 182, 212, 0.2); font-weight: 700; }

        .chart-box { width: 100%; height: 180px; margin-top: 10px; display: none; }

        /* Speaker Notes Panel */
        .notes-panel { width: 100%; max-width: 850px; margin-top: 10px; background: rgba(15, 23, 42, 0.9); border: 1px solid var(--border-glass); border-radius: 10px; padding: 8px 12px; }
        .notes-panel textarea { width: 100%; background: transparent; border: none; outline: none; color: #cbd5e1; font-size: 0.78rem; resize: none; height: 35px; }

        /* Right AI Sidebar */
        .sidebar-ai { width: 260px; background: var(--panel-bg); border-right: 1px solid var(--border-glass); padding: 12px; display: flex; flex-direction: column; gap: 10px; }
        .ai-chat { flex: 1; background: rgba(0,0,0,0.25); border: 1px solid var(--border-glass); border-radius: 10px; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .chat-msg { padding: 8px 12px; border-radius: 8px; font-size: 0.78rem; line-height: 1.4; }
        .chat-msg.ai { background: rgba(99, 102, 241, 0.15); border: 1px solid rgba(99, 102, 241, 0.3); }
        .chat-msg.user { background: var(--accent-cyan); color: #000; font-weight: 700; align-self: flex-end; }

        /* Scientific Calculator Modal */
        .calc-modal {
            position: fixed; top: 70px; left: 20px; background: rgba(15, 23, 42, 0.95);
            border: 1px solid var(--accent-cyan); border-radius: 12px; padding: 12px;
            width: 270px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); display: none; z-index: 1000; backdrop-filter: blur(10px);
        }
        .calc-display { width: 100%; background: #000; border: 1px solid var(--border-glass); color: #00ffcc; font-family: monospace; font-size: 1.1rem; text-align: left; padding: 8px; border-radius: 6px; margin-bottom: 8px; }
        .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
        .calc-btn { background: rgba(255,255,255,0.08); border: 1px solid var(--border-glass); color: white; padding: 8px; border-radius: 4px; cursor: pointer; font-size: 0.75rem; font-weight: 700; text-align: center; }
        .calc-btn:hover { background: var(--accent-cyan); color: black; }

        /* Laser Pointer Element */
        #laser {
            position: fixed; width: 16px; height: 16px; background: #ff0055;
            border-radius: 50%; box-shadow: 0 0 15px #ff0055, 0 0 30px #ff0055;
            pointer-events: none; display: none; z-index: 9999; transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>

    <div id="laser"></div>

    <!-- Header Navigation -->
    <header class="header-nav">
        <div class="brand"><i class="fa-solid fa-layer-group"></i> Presentation Pro Ultimate Suite</div>
        <div style="display:flex; gap:6px;">
            <button class="btn btn-amber" onclick="toggleCalc()"><i class="fa-solid fa-calculator"></i> الحاسبة العلمية</button>
            <button class="btn btn-pink" onclick="toggleLaser()"><i class="fa-solid fa-wand-magic-sparkles"></i> <span id="laserText">تفعيل الليزر</span></button>
            <button class="btn btn-indigo" onclick="alert('سيبدأ العرض السينمائي 3D!')"><i class="fa-solid fa-play"></i> العرض 3D</button>
        </div>
    </header>

    <!-- Navigation Ribbon Tabs -->
    <div class="ribbon-container">
        <div class="ribbon-tabs">
            <button class="tab-btn active" onclick="switchTab('home', event)"><i class="fa-solid fa-house"></i> الرئيسية</button>
            <button class="tab-btn" onclick="switchTab('word', event)"><i class="fa-solid fa-file-word"></i> أدوات Word (تنسيق)</button>
            <button class="tab-btn" onclick="switchTab('excel', event)"><i class="fa-solid fa-file-excel"></i> أدوات Excel (جداول ومبيانات)</button>
            <button class="tab-btn" onclick="switchTab('powerpoint', event)"><i class="fa-solid fa-file-powerpoint"></i> أدوات PowerPoint (تصاميم)</button>
            <button class="tab-btn" onclick="switchTab('ai', event)"><i class="fa-solid fa-robot"></i> الذكاء الاصطناعي</button>
            <button class="tab-btn" onclick="switchTab('speech', event)"><i class="fa-solid fa-microphone"></i> الصوت والإلقاء</button>
        </div>

        <!-- Toolbars -->
        <div class="ribbon-toolbar active" id="tab-home">
            <div class="tool-group">
                <button class="btn btn-cyan" onclick="addSlide()"><i class="fa-solid fa-plus"></i> شريحة جديدة</button>
                <button class="btn" onclick="deleteSlide()"><i class="fa-solid fa-trash"></i> حذف</button>
            </div>
            <div class="tool-group">
                <button class="btn" onclick="window.print()"><i class="fa-solid fa-print"></i> طباعة / PDF</button>
            </div>
        </div>

        <div class="ribbon-toolbar" id="tab-word">
            <div class="tool-group">
                <button class="btn" onclick="formatText('bold')"><i class="fa-solid fa-bold"></i></button>
                <button class="btn" onclick="formatText('italic')"><i class="fa-solid fa-italic"></i></button>
                <button class="btn" onclick="formatText('underline')"><i class="fa-solid fa-underline"></i></button>
            </div>
            <div class="tool-group">
                <button class="btn" onclick="formatText('justifyRight')"><i class="fa-solid fa-align-right"></i></button>
                <button class="btn" onclick="formatText('justifyCenter')"><i class="fa-solid fa-align-center"></i></button>
                <button class="btn" onclick="formatText('justifyLeft')"><i class="fa-solid fa-align-left"></i></button>
            </div>
            <div class="tool-group">
                <input type="color" onchange="formatTextColor(this.value)" style="border:none; background:transparent; cursor:pointer;">
            </div>
        </div>

        <div class="ribbon-toolbar" id="tab-excel">
            <div class="tool-group">
                <button class="btn btn-emerald" onclick="insertTable()"><i class="fa-solid fa-table"></i> إدراج جدول</button>
            </div>
            <div class="tool-group">
                <button class="btn btn-cyan" onclick="insertChart('bar')"><i class="fa-solid fa-chart-column"></i> أعمدة</button>
                <button class="btn btn-amber" onclick="insertChart('line')"><i class="fa-solid fa-chart-line"></i> خطي</button>
                <button class="btn btn-pink" onclick="insertChart('pie')"><i class="fa-solid fa-chart-pie"></i> دائري</button>
            </div>
        </div>

        <div class="ribbon-toolbar" id="tab-powerpoint">
            <div class="tool-group">
                <button class="btn" onclick="changeSlideBg('rgba(30, 41, 59, 0.75)')">افتراضي</button>
                <button class="btn" onclick="changeSlideBg('linear-gradient(135deg, #1e1b4b, #0f172a)')">تدرج ليلي</button>
                <button class="btn" onclick="changeSlideBg('linear-gradient(135deg, #065f46, #064e3b)')">تدرج زمردي</button>
            </div>
        </div>

        <div class="ribbon-toolbar" id="tab-ai">
            <div class="tool-group">
                <button class="btn btn-emerald" onclick="summarizeSlide()"><i class="fa-solid fa-bolt"></i> تلخيص محتوى الشريحة</button>
            </div>
        </div>

        <div class="ribbon-toolbar" id="tab-speech">
            <div class="tool-group">
                <button class="btn btn-emerald" onclick="speakText()"><i class="fa-solid fa-volume-high"></i> قراءة بصوت واضح</button>
            </div>
        </div>
    </div>

    <!-- Workspace -->
    <div class="workspace">
        <aside class="sidebar-slides">
            <div style="font-size:0.78rem; font-weight:800; color:var(--accent-cyan);">الشرائح والمشاريع</div>
            <div class="slides-list" id="slidesContainer"></div>
        </aside>

        <main class="stage">
            <div class="slide-wrapper">
                <div class="slide-card" id="slideCard">
                    <input type="text" class="slide-title-input" id="slideTitle" placeholder="عنوان الشريحة..." oninput="saveSlide()">
                    <div class="editable-body" id="slideBody" contenteditable="true" oninput="saveSlide()">
                        اكتب الشرح والتفاصيل هنا...
                    </div>
                    <div id="tableHolder"></div>
                    <div class="chart-box" id="chartHolder">
                        <canvas id="myChart"></canvas>
                    </div>
                </div>
            </div>

            <div class="notes-panel">
                <label style="font-size:0.75rem; color:var(--accent-amber); font-weight:800;">📝 ملاحظات المحاضر (تظهر لك فقط):</label>
                <textarea id="slideNotes" placeholder="اكتب ملاحظاتك العلمية..." oninput="saveSlide()"></textarea>
            </div>
        </main>

        <aside class="sidebar-ai">
            <div style="font-size:0.78rem; font-weight:800; color:var(--accent-indigo);">مساعد الذكاء الاصطناعي</div>
            <div class="ai-chat" id="chatBox">
                <div class="chat-msg ai">مرحباً! أنا جاهز لمساعدتك في صياغة المحتوى والتحليلات.</div>
            </div>
            <div style="display:flex; gap:4px;">
                <input type="text" id="aiQuery" placeholder="اسأل الذكاء الاصطناعي..." style="flex:1; padding:6px; border-radius:6px; background:#0f172a; border:1px solid var(--border-glass); color:white; font-size:0.75rem;">
                <button class="btn btn-cyan" onclick="askAI()">إرسال</button>
            </div>
        </aside>
    </div>

    <!-- Scientific Calculator Modal -->
    <div class="calc-modal" id="calcModal">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
            <span style="font-size:0.75rem; font-weight:800; color:var(--accent-cyan);">آلة حاسبة علمية</span>
            <button class="btn" style="padding:2px 6px;" onclick="toggleCalc()">✕</button>
        </div>
        <input type="text" class="calc-display" id="calcInput" readonly value="0">
        <div class="calc-grid">
            <div class="calc-btn" onclick="calcCmd('sin')">sin</div>
            <div class="calc-btn" onclick="calcCmd('cos')">cos</div>
            <div class="calc-btn" onclick="calcCmd('tan')">tan</div>
            <div class="calc-btn" onclick="calcCmd('C')" style="background:#ef4444;">C</div>

            <div class="calc-btn" onclick="calcCmd('sqrt')">√</div>
            <div class="calc-btn" onclick="calcCmd('sq')">x²</div>
            <div class="calc-btn" onclick="calcCmd('log')">log</div>
            <div class="calc-btn" onclick="calcOp('/')">/</div>

            <div class="calc-btn" onclick="calcNum('7')">7</div>
            <div class="calc-btn" onclick="calcNum('8')">8</div>
            <div class="calc-btn" onclick="calcNum('9')">9</div>
            <div class="calc-btn" onclick="calcOp('*')">*</div>

            <div class="calc-btn" onclick="calcNum('4')">4</div>
            <div class="calc-btn" onclick="calcNum('5')">5</div>
            <div class="calc-btn" onclick="calcNum('6')">6</div>
            <div class="calc-btn" onclick="calcOp('-')">-</div>

            <div class="calc-btn" onclick="calcNum('1')">1</div>
            <div class="calc-btn" onclick="calcNum('2')">2</div>
            <div class="calc-btn" onclick="calcNum('3')">3</div>
            <div class="calc-btn" onclick="calcOp('+')">+</div>

            <div class="calc-btn" onclick="calcNum('0')">0</div>
            <div class="calc-btn" onclick="calcNum('.')">.</div>
            <div class="calc-btn" onclick="calcCmd('pi')">π</div>
            <div class="calc-btn" onclick="calcEqual()" style="background:var(--accent-cyan); color:black;">=</div>
        </div>
    </div>

    <script>
        let slides = [
            { 
                title: "🔬 مرحلة 1: الملاحظة وطرح المشكلة", 
                body: "📘 <b>التعريف الموضوعي:</b><br>هي الخطوة الأولى في المنهج العلمي، حيث يتم جمع الملاحظات وتحديد الإشكالية بدقة.<br><br>📌 <b>الخطوات والمستلزمات:</b><br>• الملاحظة الميدانية والمحاكاة الدقيقة.<br>• صياغة المشكلة في قالب محدد يسهل قياسه.", 
                notes: "التأكيد على جمع البيانات الأولية بسرعة وبدون تحيز.", 
                tableHtml: "", 
                bg: "rgba(30, 41, 59, 0.75)" 
            },
            { 
                title: "💡 مرحلة 2: صياغة الفرضيات العلمية", 
                body: "📘 <b>التعريف الموضوعي:</b><br>الفرضية هي تفسير ذكي ومؤقت للظاهرة يتم اختباره للتأكد من صحته.", 
                notes: "تذكير الجمهور بأن الفرضية ليست حقيقة جازمة.", 
                tableHtml: "", 
                bg: "rgba(30, 41, 59, 0.75)" 
            }
        ];

        let currentIndex = 0;
        let isLaserActive = false;
        let currentChart = null;

        function renderSlidesList() {
            const container = document.getElementById('slidesContainer');
            container.innerHTML = '';
            slides.forEach((slide, idx) => {
                const el = document.createElement('div');
                el.className = `slide-thumb ${idx === currentIndex ? 'active' : ''}`;
                el.onclick = () => { currentIndex = idx; loadSlide(); renderSlidesList(); };
                el.innerHTML = `<strong>شريحة ${idx + 1}</strong><br><span style="color:var(--text-secondary);">${slide.title.substring(0, 18)}...</span>`;
                container.appendChild(el);
            });
        }

        function loadSlide() {
            const cur = slides[currentIndex];
            document.getElementById('slideTitle').value = cur.title || '';
            document.getElementById('slideBody').innerHTML = cur.body || '';
            document.getElementById('slideNotes').value = cur.notes || '';
            document.getElementById('slideCard').style.background = cur.bg || 'rgba(30, 41, 59, 0.75)';
            document.getElementById('tableHolder').innerHTML = cur.tableHtml || '';
        }

        function saveSlide() {
            slides[currentIndex].title = document.getElementById('slideTitle').value;
            slides[currentIndex].body = document.getElementById('slideBody').innerHTML;
            slides[currentIndex].notes = document.getElementById('slideNotes').value;
            slides[currentIndex].tableHtml = document.getElementById('tableHolder').innerHTML;
            renderSlidesList();
        }

        function formatText(cmd) { document.execCommand(cmd, false, null); saveSlide(); }
        function formatTextColor(color) { document.execCommand('foreColor', false, color); saveSlide(); }

        function insertTable() {
            const html = `
                <table class="dynamic-table" contenteditable="true">
                    <tr><th>العنصر / المتغير</th><th>القيمة (A)</th><th>القيمة (B)</th></tr>
                    <tr><td>البيانة 1</td><td>100</td><td>85%</td></tr>
                    <tr><td>البيانة 2</td><td>250</td><td>92%</td></tr>
                </table>
            `;
            document.getElementById('tableHolder').innerHTML = html;
            saveSlide();
        }

        function insertChart(type) {
            const box = document.getElementById('chartHolder');
            box.style.display = 'block';
            const ctx = document.getElementById('myChart').getContext('2d');
            if(currentChart) currentChart.destroy();
            
            currentChart = new Chart(ctx, {
                type: type,
                data: {
                    labels: ['مرحلة 1', 'مرحلة 2', 'مرحلة 3', 'مرحلة 4'],
                    datasets: [{
                        label: 'مؤشر النمو والتجارب',
                        data: [12, 19, 7, 25],
                        backgroundColor: ['#06b6d4', '#6366f1', '#ec4899', '#10b981']
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }

        function changeSlideBg(val) {
            document.getElementById('slideCard').style.background = val;
            slides[currentIndex].bg = val;
        }

        function addSlide() {
            slides.push({ title: "شريحة جديدة", body: "اكتب الشرح هنا...", notes: "", tableHtml: "", bg: "rgba(30, 41, 59, 0.75)" });
            currentIndex = slides.length - 1; loadSlide(); renderSlidesList();
        }

        function deleteSlide() {
            if (slides.length <= 1) return alert("لا يمكن حذف الشريحة الأخيرة!");
            slides.splice(currentIndex, 1);
            currentIndex = Math.max(0, currentIndex - 1);
            loadSlide(); renderSlidesList();
        }

        function switchTab(name, ev) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.ribbon-toolbar').forEach(p => p.classList.remove('active'));
            ev.currentTarget.classList.add('active');
            document.getElementById(`tab-${name}`).classList.add('active');
        }

        function toggleLaser() {
            isLaserActive = !isLaserActive;
            document.getElementById('laser').style.display = isLaserActive ? 'block' : 'none';
            document.getElementById('laserText').innerText = isLaserActive ? 'إيقاف الليزر' : 'تفعيل الليزر';
        }

        document.addEventListener('mousemove', (e) => {
            if (isLaserActive) {
                const laser = document.getElementById('laser');
                laser.style.left = e.clientX + 'px';
                laser.style.top = e.clientY + 'px';
            }
        });

        function toggleCalc() {
            const modal = document.getElementById('calcModal');
            modal.style.display = modal.style.display === 'block' ? 'none' : 'block';
        }
        function calcNum(v) {
            const d = document.getElementById('calcInput');
            if(d.value === '0') d.value = v; else d.value += v;
        }
        function calcOp(o) { document.getElementById('calcInput').value += o; }
        function calcCmd(c) {
            const d = document.getElementById('calcInput');
            let val = parseFloat(d.value);
            if(c==='C') d.value='0';
            else if(c==='sin') d.value = Math.sin(val * Math.PI/180).toFixed(4);
            else if(c==='cos') d.value = Math.cos(val * Math.PI/180).toFixed(4);
            else if(c==='tan') d.value = Math.tan(val * Math.PI/180).toFixed(4);
            else if(c==='sqrt') d.value = Math.sqrt(val).toFixed(4);
            else if(c==='sq') d.value = Math.pow(val, 2);
            else if(c==='log') d.value = Math.log10(val).toFixed(4);
            else if(c==='pi') d.value = Math.PI.toFixed(4);
        }
        function calcEqual() {
            try { document.getElementById('calcInput').value = eval(document.getElementById('calcInput').value); }
            catch(e) { document.getElementById('calcInput').value = 'Error'; }
        }

        function speakText() {
            const text = `${slides[currentIndex].title}. ${document.getElementById('slideBody').innerText}`;
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'ar-SA';
            window.speechSynthesis.speak(utter);
        }

        async function askAI() {
            const input = document.getElementById('aiQuery');
            const txt = input.value.trim();
            if(!txt) return;
            const chatBox = document.getElementById('chatBox');
            chatBox.innerHTML += `<div class="chat-msg user">${txt}</div>`;
            input.value = '';
            try {
                const res = await fetch(`https://text.pollinations.ai/${encodeURIComponent(txt)}`);
                const reply = await res.text();
                chatBox.innerHTML += `<div class="chat-msg ai">${reply}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            } catch(err) {}
        }

        renderSlidesList();
        loadSlide();
    </script>
</body>
</html>
